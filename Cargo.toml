[package]
name = "as5048b_magnetic_encoder"
version = "0.1.0"
edition = "2024"
authors = ["Arthur Lovekin <arthurlovekin@gmail.com>"]
description = "Driver for the AMS AS5048B magnetic rotary encoder over I²C, built on embedded-hal 1.0."
license = "MIT"
repository = "https://github.com/arthurlovekin/as5048b_magnetic_encoder"
readme = "README.md"
keywords = ["embedded-hal", "i2c", "encoder", "as5048b", "no-std"]
categories = ["embedded", "no-std", "hardware-support"]

[dependencies]
embedded-hal = "1.0"
defmt = { version = "1.0", optional = true }

[dev-dependencies]
embedded-hal-mock = { version = "0.11", default-features = false, features = ["eh1"] }

[features]
default = []
defmt = ["dep:defmt"]
