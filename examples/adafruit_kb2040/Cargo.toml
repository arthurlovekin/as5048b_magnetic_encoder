[package]
name = "grid_teleop_arm_kb2040"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "simple"
path = "src/simple.rs"

[[bin]]
name = "program_zero_position"
path = "src/program_zero_position.rs"

[dependencies]
cortex-m-rt = { version = "0.7.3", optional = true }
embedded-hal = "1.0.0"
rp2040-boot2 = { version = "0.3.0", optional = true }
rp2040-hal = "0.10.0"
adafruit-kb2040 = "0.8.0"
panic-halt = "0.2.0"
fugit = "0.3"
heapless = "0.8"

# Native USB CDC serial (shows up as /dev/ttyACM* on the host).
usb-device = "0.3"
usbd-serial = "0.2"

as5048b_magnetic_encoder = { path = "../.." }

[features]
default = ["boot2", "rt", "critical-section-impl", "rom-func-cache"]
critical-section-impl = ["rp2040-hal/critical-section-impl"]
boot2 = ["rp2040-boot2"]
rt = ["cortex-m-rt", "rp2040-hal/rt"]
rp2040-e5 = ["rp2040-hal/rp2040-e5"]
rom-func-cache = ["rp2040-hal/rom-func-cache"]
disable-intrinsics = ["rp2040-hal/disable-intrinsics"]
rom-v2-intrinsics = ["rp2040-hal/rom-v2-intrinsics"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
